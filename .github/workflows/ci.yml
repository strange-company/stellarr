name: CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A new push to a PR cancels that PR's in-flight run instead of queueing
# behind it on the single self-hosted runner.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap jobs run on GitHub-hosted runners so docs/config PRs are not
  # blocked when the self-hosted Mac runner is offline.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'engine/**'
              - 'ui/**'
              - 'CMakeLists.txt'
              - '.github/workflows/ci.yml'

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Policy checks (make check)
        run: make check CHECK_RANGE=origin/${{ github.base_ref || 'main' }}..HEAD

  run-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: TypeScript check
        run: cd ui && npx tsc --noEmit

      - name: Build UI
        run: cd ui && npm run build

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build engine
        run: cmake --build build -j4

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # Gate job — satisfies the required "build-and-test" status check.
  # Passes when policy checks pass and the build succeeds or is skipped by
  # the path filter.
  build-and-test:
    if: always()
    needs: [changes, checks, run-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for result in "${{ needs.changes.result }}" "${{ needs.checks.result }}" "${{ needs.run-build.result }}"; do
            case "$result" in
              failure|cancelled) echo "A required job did not pass ($result)"; exit 1 ;;
            esac
          done
          echo "OK"
